<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#100c18" />
  <meta name="description" content="使用本地 WebGL 与 PBR 纹理制作的中文塔罗牌抽卡页面" />
  <title>塔罗牌</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="fixed-background" aria-hidden="true"></div>
  <div class="background-overlay" aria-hidden="true"></div>
  <canvas id="tarot-canvas" aria-hidden="true"></canvas>

  <main class="page-shell">
    <header class="hero">
      <p class="eyebrow">静听命运的回响</p>
      <h1>塔罗牌</h1>
      <div class="title-ornament" aria-hidden="true"><span></span><i></i><span></span></div>
      <button id="shuffle-button" class="shuffle-button" type="button">重新洗牌</button>
      <p id="status" class="status" aria-live="polite">正在载入牌面纹理…</p>
    </header>

    <section id="card-column" class="card-column" aria-label="四张塔罗牌"></section>

    <footer class="page-footer">
      <p>点击牌面或按数字键 1–4 翻牌</p>
    </footer>
  </main>

  <div id="fatal-error" class="fatal-error" role="alert" hidden></div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
